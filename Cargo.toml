[package]
edition       = "2024"
name          = "hazard3-st7789v-sprite"
version       = "0.5.0"
authors       = ["Jorge Andre Castro <georgeandrec@gmail.com>"]
description   = "no_std sprite and animation engine for ST7789V displays in the independent Hazard3 Async ecosystem."
documentation = "https://docs.rs/hazard3-st7789v-sprite"
readme        = "README.md"
keywords      = ["hazard3", "st7789v", "sprite", "animation", "no-std"]
categories    = ["embedded", "no-std", "hardware-support"]
license       = "GPL-2.0-or-later"
repository    = "https://github.com/jorgeandrecastro/hazard3-st7789v-sprite"

[lib]
name = "hazard3_st7789v_sprite"
path = "src/lib.rs"

[features]
default = ["time-hazard3"]
time-hazard3 = ["hazard3-st7789v/time-hazard3"]
time-upstream = ["hazard3-st7789v/time-upstream"]

[dependencies.hazard3-st7789v]
version = "0.8"
default-features = false

[dependencies.embedded-hal]
version = "1.0"

[dependencies.embedded-hal-async]
version = "1.0"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true